<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Search</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="full-screen" content="yes" />
    <meta name="browsermode" content="application" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="./assets/css/search.css" />
    <script src="./assets/bundle/jquery.min.js"></script>
    <script src="./assets/bundle/sortable-dnd.min.js"></script>
    <script src="./assets/js/search.js"></script>
    <script src="./assets/js/bookmark.js"></script>
    <script src="./assets/js/theme.js"></script>
  </head>

  <body>
    <header class="d-flex justify-content-between">
      <div class="d-flex left"></div>
      <div class="d-flex right">
        <div class="dropdown d-flex align-items-center">
          <a class="app-icon icon-btn p-2" data-bs-toggle="dropdown" id="appDropdown">
            <svg focusable="false" width="24" height="24">
              <use href="./assets/icons.svg#icon-app"></use>
            </svg>
          </a>
          <ul
            id="appDropdownMenu"
            class="dropdown-menu dropdown-menu-end shadow"
            aria-labelledby="appDropdown"
          >
            <div class="offcanvas-body"></div>
          </ul>
        </div>

        <div class="dropdown d-flex align-items-center">
          <a class="theme-icon icon-btn p-2" data-bs-toggle="dropdown" id="themeDropdown">
            <svg id="themeIcon" focusable="false" width="24" height="24" class="theme-icon-active">
              <use href="./assets/icons.svg#icon-theme-auto"></use>
            </svg>
          </a>
          <ul
            id="themeDropdownMenu"
            class="dropdown-menu dropdown-menu-end shadow"
            aria-labelledby="themeDropdown"
          ></ul>
        </div>

        <a href="https://github.com/mfuu/search" target="_blank" class="github-icon icon-btn p-2">
          <svg height="24" width="24">
            <use href="./assets/icons.svg#icon-github"></use>
          </svg>
        </a>
      </div>
    </header>

    <main class="container">
      <div id="search" class="search">
        <div class="logo"></div>
        <div class="search-box d-flex align-items-center justify-content-end px-2">
          <div id="searchEngine" class="dropdown position-relative">
            <a
              id="currentEngine"
              class="d-flex align-items-center px-2"
              data-bs-toggle="dropdown"
            ></a>
            <ul id="engineDropdown" class="dropdown-menu"></ul>
          </div>
          <input id="searchInput" type="text" autocomplete="off" />
          <a id="searchIcon" class="px-2 text-secondary">
            <svg width="20" height="20"><use href="./assets/icons.svg#icon-search"></use></svg>
          </a>
          <ul id="searchSuggest" class="search-suggest-menu"></ul>
        </div>
      </div>

      <div id="bookmark" class="bookmark d-flex align-items-center flex-wrap gap-4 mt-4">
        <a
          id="addBookmark"
          class="add-bookmark"
          data-bs-toggle="modal"
          data-bs-target="#bookmarkModal"
        >
          <svg width="20" height="20"><use href="./assets/icons.svg#icon-plus"></use></svg>
        </a>
      </div>

      <contextmenu>
        <li id="cm-open">新标签页打开</li>
        <li id="cm-delete">删除书签</li>
      </contextmenu>

      <!-- bookmarkModal -->
      <div
        id="bookmarkModal"
        class="modal fade"
        tabindex="-1"
        aria-labelledby="bookmarkModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <b class="modal-title" id="bookmarkModalLabel">自定义书签</b>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form>
                <div class="mb-2">
                  <label for="webSiteUrl" class="col-form-label">网址</label>
                  <input type="text" class="form-control" id="webSiteUrl" />
                </div>
                <div class="mb-2">
                  <label for="webSiteTitle" class="col-form-label">名称</label>
                  <input type="text" class="form-control" id="webSiteTitle" />
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-primary btn-sm"
                onclick="handleAddBookmark(this)"
              >
                完成
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="./assets/bundle/bootstrap.bundle.min.js"></script>
  </body>
</html>
